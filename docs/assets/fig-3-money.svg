8" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace">VERDICT SEALED</text></g><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0001;0.001;0.11;0.122;1" dur="14s" repeatCount="indefinite"/>1 · The agent asks Fiangshi about a paid URL before paying.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.099;0.111;0.29;0.302;1" dur="14s" repeatCount="indefinite"/>2 · Fiangshi makes one unpaid request and reads the 402 payment terms.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.279;0.291;0.45;0.462;1" dur="14s" repeatCount="indefinite"/>3 · It looks up the wallet that would be paid: age, funder, payers.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.439;0.451;0.62;0.632;1" dur="14s" repeatCount="indefinite"/>4 · SERV advises; every quote must match the stored evidence. Dolphin reads names.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.609;0.621;0.74;0.752;1" dur="14s" repeatCount="indefinite"/>5 · The rules decide. The verdict and a hash-chained receipt go back.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" opacity="0" class="fx-tag"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.729;0.741;0.98;0.992;1" dur="14s" repeatCount="indefinite"/>6 · Only on ALLOW does the agent pay, from its own wallet.</text><text x="380" y="396" text-anchor="middle" fill="#f2f2f2" font-size="13" font-family="ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace" class="fx-static">Agent → Fiangshi → seller, Surf, SERV, Dolphin → verdict → the agent pays, or not.</text></svg>
